services:
  postgres:
    image: postgres:16-alpine
    container_name: smart-weather-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartweather
      POSTGRES_USER: smartweather
      POSTGRES_PASSWORD: smartweather
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartweather -d smartweather"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Adminer for quick DB inspection at http://localhost:8081
  adminer:
    image: adminer:latest
    container_name: smart-weather-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
